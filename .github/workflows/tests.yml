name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    # macOS, since sift reads macOS-only things (download origins, Finder tags).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
