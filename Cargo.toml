[package]
name = "sift"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
pdf-extract = "0.12.1"
plist = "1.10.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
toml_edit = "0.25.15"
trash = "5.2.9"
xattr = "1.6.1"

[dev-dependencies]
tempfile = "3.27.0"

# The sift library + command line (this package) and the app share one
# workspace: one Cargo.lock, one build folder.
[workspace]
members = [".", "app/src-tauri"]
